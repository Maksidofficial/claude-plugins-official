name: regime-bot

on:
  push:
    paths: ["regime-bot/**", ".github/workflows/regime-bot.yml"]
  pull_request:
    paths: ["regime-bot/**", ".github/workflows/regime-bot.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: regime-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest
